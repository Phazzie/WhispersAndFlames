name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC1jbGVyay1kdW1teS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_dummy
      XAI_API_KEY: xai-dummy

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Secrets are read from the 'e2e' GitHub environment so they can be
    # protected with required reviewers (Settings -> Environments -> e2e):
    # this job runs PR-controlled code (npm lifecycle scripts, tests), so
    # credentials must not be exposed to unreviewed revisions.
    environment: e2e

    # Browser e2e needs a real Clerk dev instance: with placeholder keys,
    # clerkMiddleware 307s every browser page request to a nonexistent
    # *.clerk.accounts.dev handshake URL, so tests can never pass.
    # Configure E2E_CLERK_PUBLISHABLE_KEY / E2E_CLERK_SECRET_KEY repo
    # secrets (a Clerk development instance) to enable this job's tests.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      XAI_API_KEY: xai-dummy

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Note when Clerk e2e secrets are absent
        if: env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY == '' || env.CLERK_SECRET_KEY == ''
        run: echo "::notice::E2E tests skipped — E2E_CLERK_PUBLISHABLE_KEY / E2E_CLERK_SECRET_KEY secrets are not configured."

      - name: Checkout code
        if: env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != ''
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        if: env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != ''
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        if: env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != ''
        run: npm ci

      - name: Install Playwright browsers
        if: env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != ''
        run: npx playwright install --with-deps

      - name: Run E2E tests
        if: env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != ''
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always() && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != ''
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
