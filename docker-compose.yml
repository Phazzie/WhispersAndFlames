version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      # Database connection (if using PostgreSQL)
      - DATABASE_URL=${DATABASE_URL:-}
      # Clerk authentication (required - src/lib/env.ts validates these at
      # module load, so the container exits immediately if they are missing)
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      # AI API Key (xAI Grok - required)
      - XAI_API_KEY=${XAI_API_KEY:?XAI_API_KEY is required}
      # Bearer token for the nightly cleanup cron; without it the route 403s
      - CRON_SECRET=${CRON_SECRET:-}
      # Session secrets
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-in-production}
      # App URL
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      # Storage mode (memory or postgres)
      - STORAGE_MODE=${STORAGE_MODE:-memory}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=whispers_flames
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
