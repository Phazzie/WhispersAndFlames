name: whispers-and-flames
region: nyc

databases:
  - name: whispers-flames-db
    engine: PG
    production: true
    cluster_name: whispers-flames-db

services:
  - name: web
    # Use Docker instead of buildpack for better control
    dockerfile_path: Dockerfile
    source_dir: /
    
    github:
      repo: Phazzie/WhispersAndFlames
      branch: main
      deploy_on_push: true
    
    # Instance configuration
    instance_count: 1
    instance_size_slug: basic-xxs  # $5/month - upgrade to basic-xs ($12) if needed
    
    # Health check - increased initial delay for Docker builds
    health_check:
      http_path: /api/health
      initial_delay_seconds: 40
      period_seconds: 30
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    
    # HTTP configuration
    http_port: 3000
    
    # Environment variables
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: "production"
      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: "1"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${whispers-flames-db.DATABASE_URL}
      # Required: the app validates XAI_API_KEY at startup and will not boot
      # without it. Create a key at https://console.x.ai/
      - key: XAI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: EV[1:ZTIQ6qCDYRD+O7DGCY3zSCBe5tPLN0JR:UojT5daWzVjLXRLBg02q1A==]
      # Required: src/lib/env.ts validates both Clerk keys at module load, so
      # the app exits on boot without them. Replace the placeholders with
      # encrypted values (doctl apps update ... --env) before deploying.
      # The publishable key is needed at BUILD time too, since the client
      # bundle inlines it.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
        value: pk_replace_me_before_deploying
      # BUILD scope too: `next build` collects page data, which loads
      # src/lib/env.ts and validates this key, so a run-only secret fails
      # the build before the app ever starts.
      - key: CLERK_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: sk_replace_me_before_deploying
      # Required whenever DATABASE_URL is set: /api/cron/cleanup returns 403
      # until this is present, so expired games are never purged without it.
      - key: CRON_SECRET
        scope: RUN_TIME
        type: SECRET
        value: replace_me_with_a_long_random_string
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
